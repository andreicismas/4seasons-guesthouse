<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prenota - 4 Seasons Guest House</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">

    <h1 class="text-center mb-4">Prenota il tuo soggiorno</h1>

    <!-- Form ricerca disponibilità -->
    <div class="card p-4 shadow-sm mb-5">
        <h4>Controlla disponibilità</h4>
        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label">Check-in</label>
                <input type="date" id="checkin" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="form-label">Check-out</label>
                <input type="date" id="checkout" class="form-control">
            </div>
            <div class="col-md-4 d-flex align-items-end">
                <button class="btn btn-primary w-100" onclick="cercaDisponibilita()">Cerca</button>
            </div>
            <div id="errore-date" class="text-danger mt-3" style="display:none; font-weight:600;"></div>

        </div>
    </div>

    <!-- Risultati disponibilità -->
    <div id="risultati" class="row g-4"></div>

</div>

<!-- MODAL PRENOTAZIONE -->
<div class="modal fade" id="modalPrenota" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Conferma prenotazione</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <input type="hidden" id="room_id">

                <div class="mb-3">
                    <label class="form-label">Nome e Cognome</label>
                    <input type="text" id="guest_name" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" id="guest_email" class="form-control">
                </div>

                <hr>
                <h5>Riepilogo prenotazione</h5>
                <div id="riepilogo" class="mt-2"></div>

            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Chiudi</button>
                <button class="btn btn-primary" onclick="confermaPrenotazione()">Conferma</button>
            </div>
        </div>
    </div>
</div>
<!-- MODALE PRENOTAZIONE -->
<div class="modal fade" id="modalPrenota" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
  
        <div class="modal-header">
          <h5 class="modal-title">Conferma Prenotazione</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
  
        <div class="modal-body">
  
          <h5 class="mb-3">Riepilogo</h5>
          <div id="riepilogo" class="p-2 bg-light rounded border"></div>
  
          <hr>
  
          <h5 class="mb-2">I tuoi dati</h5>
  
          <label class="form-label mt-2">Nome Completo</label>
          <input id="nome_ospite" type="text" class="form-control">
  
          <label class="form-label mt-2">Email</label>
          <input id="email_ospite" type="email" class="form-control">
  
        </div>
  
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Annulla</button>
          <button class="btn btn-primary" onclick="confermaPrenotazione()">Conferma Prenotazione</button>
        </div>
  
      </div>
    </div>
  </div>
  

<script>
async function cercaDisponibilita() {
    let checkin = document.getElementById("checkin").value;
    let checkout = document.getElementById("checkout").value;
    let erroreBox = document.getElementById("errore-date");

    // Reset messaggio
    erroreBox.style.display = "none";
    erroreBox.innerHTML = "";

    // Controllo campi vuoti
    if (!checkin || !checkout) {
        erroreBox.innerHTML = "Per favore inserisci sia Check-in che Check-out.";
        erroreBox.style.display = "block";
        return;
    }

    let dCheckin = new Date(checkin);
    let dCheckout = new Date(checkout);
    let oggi = new Date();
    oggi.setHours(0,0,0,0);

    // Check-in nel passato
    if (dCheckin < oggi) {
        erroreBox.innerHTML = "⚠️ La data di Check-in non può essere nel passato.";
        erroreBox.style.display = "block";
        return;
    }

    // Check-out nel passato
    if (dCheckout < oggi) {
        erroreBox.innerHTML = "⚠️ La data di Check-out non può essere nel passato.";
        erroreBox.style.display = "block";
        return;
    }

    // Check-out prima del check-in
    if (dCheckout <= dCheckin) {
        erroreBox.innerHTML = "⚠️ La data di Check-out deve essere successiva al Check-in.";
        erroreBox.style.display = "block";
        return;
    }

    // Se tutto è ok → fetch
    let res = await fetch(`http://localhost:3000/api/availability?check_in=${checkin}&check_out=${checkout}`);
    ultimeCamereDisponibili = await res.json();
    let camere = ultimeCamereDisponibili;


    let html = "";
    camere.forEach(c => {
        html += `
            <div class="col-md-4">
                <div class="card shadow-sm p-3">
                    <h4>${c.name}</h4>
                    <button class="btn btn-primary mt-3" onclick="apriPrenotazione(${c.id})">Prenota</button>
                </div>
            </div>
        `;
    });

    document.getElementById("risultati").innerHTML = html;
}

function apriPrenotazione(roomId) {
    let checkin = document.getElementById("checkin").value;
    let checkout = document.getElementById("checkout").value;

    let dCheckin = new Date(checkin);
    let dCheckout = new Date(checkout);

    let notti = Math.ceil((dCheckout - dCheckin) / (1000 * 60 * 60 * 24));

    let camera = ultimeCamereDisponibili.find(c => c.id === roomId);

    let totale = camera.price_per_night * notti;

    document.getElementById("riepilogo").innerHTML = `
        <p><strong>Camera:</strong> ${camera.name}</p>
        <p><strong>Check-in:</strong> ${checkin}</p>
        <p><strong>Check-out:</strong> ${checkout}</p>
        <p><strong>Notti:</strong> ${notti}</p>
        <p><strong>Prezzo per notte:</strong> € ${camera.price_per_night}</p>
        <p><strong>Totale soggiorno:</strong>
           <span style="font-size:1.3em; color:#0d6efd;">€ ${totale}</span>
        </p>
    `;

    cameraSelezionata = {
        id: roomId,
        checkin,
        checkout,
        notti,
        totale
    };

    let modal = new bootstrap.Modal(document.getElementById("modalPrenota"));
    modal.show();
}

async function confermaPrenotazione() {
    if (!cameraSelezionata) {
        alert("Errore: nessuna camera selezionata.");
        return;
    }

    let nome = document.getElementById("nome_ospite").value.trim();
    let email = document.getElementById("email_ospite").value.trim();

    if (!nome || !email) {
        alert("Per favore inserisci Nome ed Email.");
        return;
    }

    let body = {
        room_id: cameraSelezionata.id,
        check_in: cameraSelezionata.checkin,
        check_out: cameraSelezionata.checkout,
        nome,
        email
    };

    let res = await fetch("http://localhost:3000/api/bookings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
    });

    let result = await res.json();

    if (result.success) {
        alert("Prenotazione confermata! Ti aspettiamo 😊");
        window.location.href = "index.html"; // torna alla home
    } else {
        alert("Errore: " + result.error);
    }
}


document.getElementById("checkin").addEventListener("input", () => {
    document.getElementById("errore-date").style.display = "none";
});

document.getElementById("checkout").addEventListener("input", () => {
    document.getElementById("errore-date").style.display = "none";
});


</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
